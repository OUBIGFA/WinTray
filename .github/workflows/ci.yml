name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        shell: pwsh
        run: |
          gofmt -l . | ForEach-Object { throw "gofmt required for: $_" }

      - name: Run vet
        shell: pwsh
        run: go vet ./...

      - name: Run tests
        shell: pwsh
        run: go test ./... -cover

      - name: Build
        shell: pwsh
        run: go build ./...
